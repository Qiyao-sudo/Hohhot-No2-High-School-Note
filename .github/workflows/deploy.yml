name: Sync & Verify

# 自动: 每天凌晨 3 点同步源文档并提交; 推送 main 时验证构建
# 手动: 仓库 Actions 页面选择 "Sync & Verify" 点击 Run workflow
# 部署由宝塔服务器的 sync.sh 完成(每 6 小时拉取 main 自行构建, 见 docs/linux-deploy.md)
on:
  schedule:
    - cron: '0 19 * * *' # UTC 19:00 = 北京时间次日 3:00
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-sync
  cancel-in-progress: true

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (图片压缩)
        run: pip install pillow

      - name: Sync from Tencent Doc (源文档)
        run: python scripts/sync_doc.py

      - name: Commit synced content (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs server/data
          if git diff --cached --quiet; then
            echo "No document changes."
          else
            git commit -m "docs: sync from Tencent doc $(date +'%Y-%m-%d %H:%M') [skip ci]"
            git push
          fi

      # 构建验证: 保证 main 始终可构建(服务器 sync.sh 拉到的就是这份代码;
      # 知识库 server/data/kb.mjs 一并重建提交, 供纯运行场景直接使用)
      - name: Rebuild KB and verify build
        run: |
          npm ci
          npm run build
          git add server/data
          if git diff --cached --quiet; then
            echo "KB unchanged."
          else
            git commit -m "chore: rebuild assistant KB [skip ci]"
            git push
          fi
