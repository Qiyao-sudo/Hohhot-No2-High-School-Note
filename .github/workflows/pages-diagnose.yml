name: Pages Diagnose

# 临时诊断: 在 CI 内直接调用 Pages API, 把原始响应写回仓库文件
# pages-diagnostic.txt (提交带 [skip ci] 不再触发工作流), 排查完删除本文件。
on: [push, workflow_dispatch]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe Pages API and write result to repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "== GET /repos/$GITHUB_REPOSITORY/pages =="
            gh api "repos/$GITHUB_REPOSITORY/pages"
            echo
            echo "== POST create (build_type=workflow) =="
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages" \
              -f build_type=workflow \
              -f "source[branch]=main" -f "source[path]=/"
            echo
            echo "== GET after POST =="
            gh api "repos/$GITHUB_REPOSITORY/pages"
            echo
            echo "== repo visibility =="
            gh api "repos/$GITHUB_REPOSITORY" -q '.private'
          } > pages-diagnostic.txt 2>&1
          cat pages-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-diagnostic.txt
          git commit -m "chore: pages diagnostic [skip ci]"
          git push
